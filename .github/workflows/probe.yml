name: probe-careers
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: full dress rehearsal of the cloud collector
        run: timeout 85m python -u -m collector.collect --runner cloud > data/rehearsal.log 2>&1 || true
      - name: commit results
        if: always()
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          cp data/cloud/health.json data/rehearsal_health.json || true
          git checkout -- data/cloud || true
          git add data/rehearsal*
          git commit -m "rehearsal results [skip ci]" || exit 0
          git push
