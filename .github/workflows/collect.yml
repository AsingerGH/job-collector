name: collect-jobs

on:
  schedule:
    - cron: "17 10 * * *"     # daily ~5:17 AM ET, ahead of the 7:37 CT Claude review
    - cron: "17 22 * * *"     # second pass ~5:17 PM ET (catches same-day postings)
    - cron: "41 8 * * 0"      # Sundays: rediscover company job feeds
  workflow_dispatch:
    inputs:
      discover:
        description: "Run feed discovery too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect
        if: github.event.schedule != '41 8 * * 0'
        timeout-minutes: 40
        run: python -m collector.collect --runner cloud
      - name: Discover company job feeds
        if: github.event.schedule == '41 8 * * 0' || inputs.discover
        timeout-minutes: 25
        continue-on-error: true
        run: python -m collector.discover --add-unmatched --budget-min 20
      - name: Commit results
        if: always()
        run: |
          git config user.name "job-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data config/discovered.yaml || true
          git diff --cached --quiet || git commit -m "data: cloud run $(date -u +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
