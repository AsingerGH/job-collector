# Job-board searches (JobSpy). Edit freely; the Claude task can also tune these.
hours_old: 72                # only pull postings from the last 3 days (daily runs overlap safely)
board_stale_days: 7          # a board-only posting unseen for 7 days is marked stale
max_posting_age_days: 45     # older postings are flagged "old-posting" for Claude to double-check
# One-off deep look-back (catches rolling postings opened weeks ago). Turns itself off after `until`.
backfill:
  until: "2026-11-24"         # last day (Central) the deep look-back applies
  hours_old: 720              # 30 days
  results_per_search: 50

locations:
  - name: "New York, NY"
    distance: 10
  - name: "Jersey City, NJ"
    distance: 5
    all_terms: false          # trading terms only (most JC hits are ops/tech)
  - name: "Chicago, IL"
    distance: 10
    all_terms: false

terms:
  # Priority 1 - equities / FI / electronic trading
  - "trading analyst"
  - "sales and trading analyst"
  - "equity trading analyst"
  - "sales trader"
  - "trading assistant"
  - "electronic trading analyst"
  - "execution services analyst"
  - "fixed income trading analyst"
  - "rates trading analyst"
  - "credit trading analyst"
  - "global markets analyst"
  - "markets full time analyst 2027"
  - "2027 full time analyst"
  - "new analyst program 2027"
  - "graduate trader"
  - "junior trader"
  - "equity trading associate"
  - "sales trading associate"
  - "equity trading assistant"
  # Priority 1 - investment banking / capital markets (moved up 2026-11-23)
  - "investment banking analyst"
  - "capital markets analyst"
  - "equity capital markets analyst"
  - "debt capital markets analyst"
  - "leveraged finance analyst"
  # Priority 2
  - "derivatives analyst"
  - "options trader entry level"
  - "commodities analyst"
  # Priority 3 (Claude keeps only excellent fits)
  - "equity research associate"
  - "investment banking analyst 2027"
  - "corporate banking analyst"
  # Summer 2027 internship track
  - "summer 2027 sales and trading internship"
  - "summer 2027 analyst internship markets"
  - "2027 summer trading intern"

trading_terms:
  - "trading analyst"
  - "equity trading associate"
  - "investment banking analyst"
  - "sales and trading analyst"
  - "trading assistant"
  - "junior trader"
  - "graduate trader"
  - "global markets analyst"
  - "2027 full time analyst"
  - "summer 2027 trading internship"

runners:
  cloud:                       # GitHub Actions (datacenter IP)
    ats: true
    sites: ["indeed", "linkedin"]   # google / zip_recruiter / glassdoor block GitHub's servers (tested 2026-11-23)
    results_per_search: 30
    linkedin_descriptions: false   # keep LinkedIn traffic light from the cloud
    sleep_between: 2
    sleep_after_error: 15
    ats_skip_types: ["workday"]     # Workday answered HTTP 429 to nearly every cloud request in the 2026-11-24 rehearsal; the laptop reads Workday
    use_cloud_reader: true          # ...and the cloud reads those banks' careers-site sitemaps instead where they have one
    ats_skip: ["Morgan Stanley"]    # its Eightfold API refuses cloud IPs (403); the laptop reads it
    company_searches: true          # search Indeed by firm name for watchlist firms we can't read directly
    company_sites: ["indeed"]
    company_words: ["analyst", "trading"]
    company_search_max_tier: 2
  laptop:                      # Andrew's Windows laptop (home IP, LinkedIn is happier here)
    ats: true
    ats_types: ["workday", "eightfold"]   # Workday throttles and Eightfold (Morgan Stanley) blocks GitHub's servers; home internet gets through
    workday_spacing: 1.5
    sites: ["linkedin"]        # Indeed works fine from the cloud
    hours_old: 48               # runs twice a day, so 2 days of overlap is plenty
    results_per_search: 25
    linkedin_descriptions: false   # opening every LinkedIn page took hours; the daily review opens only the promising ones
    sleep_between: 12              # LinkedIn throttled the home connection after a heavy first day (2026-11-23)
    sleep_after_error: 30
    program_pages: false           # the cloud run watches program pages
    terms:                         # shorter list for LinkedIn: highest-priority phrases only (cloud covers the rest via Indeed)
      - "trading analyst"
      - "sales and trading analyst"
      - "equity trading assistant"
      - "equity trading associate"
      - "sales trader"
      - "electronic trading analyst"
      - "fixed income trading analyst"
      - "global markets analyst"
      - "2027 full time analyst"
      - "investment banking analyst"
      - "capital markets analyst"
      - "junior trader"
      - "summer 2027 sales and trading internship"
      - "summer 2027 investment banking internship"
